name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: |
          npm install --global pnpm@10.28.0
          pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: The README's demo commands run
        run: |
          pnpm -s lienstack examples/title/title-02.json
          pnpm -s dscr examples/dscr/dscr-05.json
          pnpm -s eval
